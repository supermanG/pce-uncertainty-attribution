metadata_version: 1
name: "pce-uncertainty-attribution: code for 'Interpretable attribution of decision-relevant uncertainty in AI'"
description: |
  A polynomial surrogate of a few trained models reveals which components of a learned
  model's uncertainty a decision depends on, and how much resolving each is worth, in
  chemistry, experimental design and language-model alignment. This capsule reproduces
  every main-text figure of the Nature Machine Intelligence paper from the committed
  result files and runs the unit tests of the polynomial chaos expansion (PCE) core;
  CPU only, about one minute. The full experiments (GFlowNet ensembles for
  Buchwald-Hartwig reaction design, Bayesian optimization, RLHF reward models) and the
  Lean 4 proofs are in the repository, with per-figure recipes in REPRODUCE.md.
tags:
